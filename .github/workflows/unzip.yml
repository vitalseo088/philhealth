name: Extract ZIP to Root

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Path to the zip file (relative to repo root)'
        required: true
        default: 'source.zip'
  push:
    paths:
      - '**.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine zip file
        id: zipfile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "path=${{ github.event.inputs.zip_path }}" >> "$GITHUB_OUTPUT"
          else
            # Grab the first .zip file found (adjust if you have multiple)
            ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract zip to root
        run: |
          ZIP_PATH="${{ steps.zipfile.outputs.path }}"
          echo "Extracting: $ZIP_PATH"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "Zip file not found at $ZIP_PATH"
            exit 1
          fi

          unzip -o "$ZIP_PATH" -d /tmp/extracted

          # If the zip has a single wrapper folder, flatten it
          CONTENTS=$(ls /tmp/extracted)
          COUNT=$(echo "$CONTENTS" | wc -l)

          if [ "$COUNT" -eq 1 ] && [ -d "/tmp/extracted/$CONTENTS" ]; then
            echo "Flattening single top-level folder: $CONTENTS"
            cp -r "/tmp/extracted/$CONTENTS/." .
          else
            cp -r /tmp/extracted/. .
          fi

          # Remove the original zip after extraction (optional)
          rm -f "$ZIP_PATH"

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract zip contents to root"
          git push
